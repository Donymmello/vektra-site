# Local testing only: no domain, no HTTPS, no Caddy. Just the site + api
# containers on plain HTTP, so you can validate the same Dockerfile/build
# that will later run on the VPS.
#
# Usage:
#   docker compose -f docker-compose.local.yml up --build
#   open http://localhost:8080
services:
  site:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./server
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - CORS_ORIGIN=http://localhost:8080
    volumes:
      - api_data:/app/data

volumes:
  api_data:
